<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.svg" />
		<script>
			(function () {
				try {
					// Apply theme mode (dark/light/system)
					var mode = localStorage.getItem('ddsa-theme');
					var dark =
						mode === 'dark' ||
						(mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');

					// Apply color scheme (ocean/forest/slate/rose/amber — bronze is default)
					var scheme = localStorage.getItem('ddsa-scheme');
					if (scheme && scheme !== 'bronze') {
						document.documentElement.setAttribute('data-scheme', scheme);
					}
				} catch (e) {
					/* localStorage unavailable (private browsing) — use default theme */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<a
			href="#main-content"
			class="focus:bg-primary-600 sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[9999] focus:rounded-lg focus:px-4 focus:py-2 focus:text-white focus:shadow-lg"
			>Skip to main content</a
		>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
